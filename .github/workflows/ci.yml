name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for tests/test_repo_audit.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install Tesseract (OCR tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-tur

      - name: Install dependencies (exact lock)
        run: python -m pip install -r requirements.lock

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests, dataset/corpus verification, docs consistency
        run: python -m pytest

      - name: Corpus rebuild is byte-identical
        run: python scripts/build_sample_docs.py --check

      - name: README and RESULTS.md match results.json
        run: python -m evals.report --check
