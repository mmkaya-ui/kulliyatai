[project]
name = "kulliyatai"
version = "0.3.0"
description = "Multilingual (TR/EN/DE) hybrid RAG over PDFs with a machine-verified, statistically reported benchmark"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [".", "tests"]
addopts = "-v --strict-markers"
markers = ["models: needs the local FastEmbed models (set RUN_MODEL_TESTS=1)"]
filterwarnings = [
    # faiss' SWIG bindings on Python >= 3.12
    "ignore:builtin type Swig.*has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]
